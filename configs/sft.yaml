# Supervised Fine-Tuning (Format Cold-Start) Configuration
dataset_path: "data/splits/sft_train.jsonl"
val_dataset_path: "data/splits/sft_val.jsonl"
output_dir: "outputs/checkpoints/sft"

training:
  num_train_epochs: 1
  max_steps: 250
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 125
  eval_steps: 125
  save_total_limit: 2
  seed: 42
  bf16: true
  gradient_checkpointing: true
