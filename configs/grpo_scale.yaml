# Scaled Group Relative Policy Optimization (GRPO-Scale) Configuration
dataset_path: "data/splits/grpo_train.jsonl"
val_dataset_path: "data/splits/grpo_val.jsonl"
output_dir: "outputs/checkpoints/grpo_scale"
model_name_or_path: "outputs/checkpoints/sft/final"

training:
  num_train_epochs: 1
  max_steps: 150
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-5
  num_generations: 8
  max_prompt_length: 512
  max_completion_length: 512
  temperature: 0.8
  top_p: 0.9
  beta: 0.04
  logging_steps: 5
  save_steps: 50
  save_total_limit: 2
  seed: 42
  bf16: true
  gradient_checkpointing: true

